<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%" style="background-color: #ebf3fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Light Blueprint Background Gradients & Filters -->
    <linearGradient id="blueprint-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#e4edf7" />
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f4c81" />
    </linearGradient>

    <!-- Column Headers Light Blueprint Gradients -->
    <linearGradient id="col-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="col-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="col-emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="soft-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f2942" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Blueprint Background Layer -->
  <rect width="1400" height="960" fill="url(#blueprint-bg)" />
  
  <!-- Classic Blueprint Fine Grid Lines -->
  <g stroke="#93c5fd" stroke-width="0.75" opacity="0.35">
    <!-- 20px grid -->
    <path d="M 0,20 L 1400,20 M 0,40 L 1400,40 M 0,60 L 1400,60 M 0,80 L 1400,80 M 0,100 L 1400,100 M 0,120 L 1400,120 M 0,140 L 1400,140 M 0,160 L 1400,160 M 0,180 L 1400,180 M 0,200 L 1400,200 M 0,220 L 1400,220 M 0,240 L 1400,240 M 0,260 L 1400,260 M 0,280 L 1400,280 M 0,300 L 1400,300 M 0,320 L 1400,320 M 0,340 L 1400,340 M 0,360 L 1400,360 M 0,380 L 1400,380 M 0,400 L 1400,400 M 0,420 L 1400,420 M 0,440 L 1400,440 M 0,460 L 1400,460 M 0,480 L 1400,480 M 0,500 L 1400,500 M 0,520 L 1400,520 M 0,540 L 1400,540 M 0,560 L 1400,560 M 0,580 L 1400,580 M 0,600 L 1400,600 M 0,620 L 1400,620 M 0,640 L 1400,640 M 0,660 L 1400,660 M 0,680 L 1400,680 M 0,700 L 1400,700 M 0,720 L 1400,720 M 0,740 L 1400,740 M 0,760 L 1400,760 M 0,780 L 1400,780 M 0,800 L 1400,800 M 0,820 L 1400,820 M 0,840 L 1400,840 M 0,860 L 1400,860 M 0,880 L 1400,880 M 0,900 L 1400,900 M 0,920 L 1400,920 M 0,940 L 1400,940" />
    <path d="M 20,0 L 20,960 M 40,0 L 40,960 M 60,0 L 60,960 M 80,0 L 80,960 M 100,0 L 100,960 M 120,0 L 120,960 M 140,0 L 140,960 M 160,0 L 160,960 M 180,0 L 180,960 M 200,0 L 200,960 M 220,0 L 220,960 M 240,0 L 240,960 M 260,0 L 260,960 M 280,0 L 280,960 M 300,0 L 300,960 M 320,0 L 320,960 M 340,0 L 340,960 M 360,0 L 360,960 M 380,0 L 380,960 M 400,0 L 400,960 M 420,0 L 420,960 M 440,0 L 440,960 M 460,0 L 460,960 M 480,0 L 480,960 M 500,0 L 500,960 M 520,0 L 520,960 M 540,0 L 540,960 M 560,0 L 560,960 M 580,0 L 580,960 M 600,0 L 600,960 M 620,0 L 620,960 M 640,0 L 640,960 M 660,0 L 660,960 M 680,0 L 680,960 M 700,0 L 700,960 M 720,0 L 720,960 M 740,0 L 740,960 M 760,0 L 760,960 M 780,0 L 780,960 M 800,0 L 800,960 M 820,0 L 820,960 M 840,0 L 840,960 M 860,0 L 860,960 M 880,0 L 880,960 M 900,0 L 900,960 M 920,0 L 920,960 M 940,0 L 940,960 M 960,0 L 960,960 M 980,0 L 980,960 M 1000,0 L 1000,960 M 1020,0 L 1020,960 M 1040,0 L 1040,960 M 1060,0 L 1060,960 M 1080,0 L 1080,960 M 1100,0 L 1100,960 M 1120,0 L 1120,960 M 1140,0 L 1140,960 M 1160,0 L 1160,960 M 1180,0 L 1180,960 M 1200,0 L 1200,960 M 1220,0 L 1220,960 M 1240,0 L 1240,960 M 1260,0 L 1260,960 M 1280,0 L 1280,960 M 1300,0 L 1300,960 M 1320,0 L 1320,960 M 1340,0 L 1340,960 M 1360,0 L 1360,960 M 1380,0 L 1380,960" />
  </g>
  
  <!-- 100px Blueprint Major Lines -->
  <g stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="8,4" opacity="0.4">
    <path d="M 0,100 L 1400,100 M 0,200 L 1400,200 M 0,300 L 1400,300 M 0,400 L 1400,400 M 0,500 L 1400,500 M 0,600 L 1400,600 M 0,700 L 1400,700 M 0,800 L 1400,800 M 0,900 L 1400,900" />
    <path d="M 100,0 L 100,960 M 200,0 L 200,960 M 300,0 L 300,960 M 400,0 L 400,960 M 500,0 L 500,960 M 600,0 L 600,960 M 700,0 L 700,960 M 800,0 L 800,960 M 900,0 L 900,960 M 1000,0 L 1000,960 M 1100,0 L 1100,960 M 1200,0 L 1200,960 M 1300,0 L 1300,960" />
  </g>

  <!-- Outer Blueprint Framing Border -->
  <rect x="25" y="25" width="1350" height="910" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="16,6" opacity="0.6"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="1280" height="90" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#93c5fd" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="30" y="42" fill="#0f2942" font-size="26" font-weight="800" letter-spacing="0.5">Vibe Coding AI Agent 系統化三維藍圖 (System Blueprint)</text>
    <text x="30" y="68" fill="#334155" font-size="14" font-weight="500">專為商管學生設計：融合【馬車➔汽車比喻】×【四大工程要素】×【三維角色協作】×【I-P-O 晨報流程】</text>
    
    <!-- Metaphor Tag -->
    <rect x="930" y="22" width="320" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="950" y="44" fill="#1e40af" font-size="13" font-weight="700">🚗 典範轉移：馬車時代 ➔ 汽車駕駛時代</text>
    <text x="950" y="60" fill="#475569" font-size="11">控制邏輯從「寫行行語法」轉變為「意圖與架構導航」</text>
  </g>

  <!-- ==================== I-P-O TRI-COLUMNS ==================== -->
  
  <!-- COLUMN 1: INPUT (意圖與脈絡) -->
  <g transform="translate(60, 160)">
    <!-- Column Card Background -->
    <rect x="0" y="0" width="390" height="600" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="390" height="54" rx="14" fill="url(#col-cyan-grad)"/>
    <text x="20" y="34" fill="#ffffff" font-size="17" font-weight="700">1. INPUT / INTENTION (意圖與脈絡)</text>
    
    <!-- Role Block -->
    <g transform="translate(20, 74)">
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="16" y="30" fill="#0369a1" font-size="15" font-weight="700">🎩 管家 Butler &amp; 🧢 教練 Coach</text>
      <text x="16" y="54" fill="#1e293b" font-size="13">• 管家：維護專案骨架、`KB/` 知識庫與版本控管</text>
      <text x="16" y="76" fill="#1e293b" font-size="13">• 教練：確認商業意圖、引導思考邊界與情緒鼓勵</text>
      <text x="16" y="98" fill="#475569" font-size="12">解說觀念：Context Window, Working Memory</text>
    </g>

    <!-- Engineering Block -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="16" y="30" fill="#4338ca" font-size="15" font-weight="700">⚡ #Prompt &amp; #Context Engineering</text>
      <text x="16" y="56" fill="#1e293b" font-size="13">1. System Prompt: 定義晨報總編輯 Persona</text>
      <text x="16" y="78" fill="#1e293b" font-size="13">2. Dynamic Context: 注入時間、天氣地點與偏好</text>
      <text x="16" y="100" fill="#1e293b" font-size="13">3. Long-term KB: 載入排版與商業規範</text>
      <rect x="16" y="114" width="318" height="24" rx="6" fill="#e0e7ff"/>
      <text x="24" y="130" fill="#3730a3" font-size="11" font-weight="700">無 Code 關鍵：切換主題只需改 KB 文字檔</text>
    </g>

    <!-- Practical Practice -->
    <g transform="translate(20, 384)">
      <rect x="0" y="0" width="350" height="190" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="30" fill="#0369a1" font-size="15" font-weight="700">🛠️ 晨報 Agent 落地實作</text>
      <text x="16" y="58" fill="#0f172a" font-size="13" font-weight="700">📄 KB/theme_config.md</text>
      <text x="32" y="78" fill="#475569" font-size="12">「目前主題：半導體趨勢 + 實習職缺」</text>
      
      <text x="16" y="106" fill="#0f172a" font-size="13" font-weight="700">📄 KB/business_rules.md</text>
      <text x="32" y="126" fill="#475569" font-size="12">「規範：400-600字、附帶商業啟示」</text>

      <rect x="16" y="142" width="318" height="32" rx="6" fill="#e0f2fe"/>
      <text x="26" y="163" fill="#0369a1" font-size="12" font-weight="700">🎯 輸入結果：高資訊密度的需求草稿</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(460, 430)">
    <path d="M 0,0 L 20,0 L 20,-10 L 40,10 L 20,30 L 20,20 L 0,20 Z" fill="#0284c7"/>
  </g>

  <!-- COLUMN 2: PROCESS (處理與調用) -->
  <g transform="translate(505, 160)">
    <!-- Column Card Background -->
    <rect x="0" y="0" width="390" height="600" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="390" height="54" rx="14" fill="url(#col-purple-grad)"/>
    <text x="20" y="34" fill="#ffffff" font-size="17" font-weight="700">2. PROCESS (數據與處理)</text>
    
    <!-- Role Block -->
    <g transform="translate(20, 74)">
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="16" y="30" fill="#6b21a8" font-size="15" font-weight="700">🛠️ 工程師 Subagent 團隊 (資料/摘要)</text>
      <text x="16" y="54" fill="#1e293b" font-size="13">• Data Fetcher: 併發抓取外部多源 API</text>
      <text x="16" y="76" fill="#1e293b" font-size="13">• AI Summarizer: 提煉核心觀點與翻譯</text>
      <text x="16" y="98" fill="#475569" font-size="12">多任務 Subagents 併發平行分工</text>
    </g>

    <!-- Engineering Block -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="16" y="30" fill="#9d174d" font-size="15" font-weight="700">🛡️ #Harness Engineering (工具與護欄)</text>
      <text x="16" y="56" fill="#1e293b" font-size="13">1. Tool API Binding: Weather, Calendar, RSS</text>
      <text x="16" y="78" fill="#1e293b" font-size="13">2. Execution Sandbox: 隔離的執行環境</text>
      <text x="16" y="100" fill="#1e293b" font-size="13">3. Security Guardrails: PII 遮蔽 + 防暴卡槽</text>
      <rect x="16" y="114" width="318" height="24" rx="6" fill="#fce7f3"/>
      <text x="24" y="130" fill="#9d174d" font-size="11" font-weight="700">資安防禦：Input Sanitization (防 Prompt Injection)</text>
    </g>

    <!-- Practical Practice -->
    <g transform="translate(20, 384)">
      <rect x="0" y="0" width="350" height="190" rx="10" fill="#f8fafc" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="16" y="30" fill="#6b21a8" font-size="15" font-weight="700">🛠️ 晨報 Agent 落地實作</text>
      <text x="16" y="58" fill="#0f172a" font-size="13" font-weight="700">🌐 外部 API 串接網</text>
      <text x="32" y="78" fill="#475569" font-size="12">• OpenWeather API / Google Calendar API</text>
      <text x="32" y="96" fill="#475569" font-size="12">• TechCrunch &amp; Hacker News RSS Feeds</text>
      
      <text x="16" y="122" fill="#0f172a" font-size="13" font-weight="700">🔐 安全金鑰保護</text>
      <text x="32" y="140" fill="#475569" font-size="12">使用 .env 隔離密鑰，防止 Git 外洩</text>

      <rect x="16" y="152" width="318" height="26" rx="6" fill="#f3e8ff"/>
      <text x="26" y="170" fill="#6b21a8" font-size="11" font-weight="700">⚙️ 處理結果：結構化資料與初步晨報文案</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(905, 430)">
    <path d="M 0,0 L 20,0 L 20,-10 L 40,10 L 20,30 L 20,20 L 0,20 Z" fill="#7e22ce"/>
  </g>

  <!-- COLUMN 3: OUTPUT & LOOP (成果與心跳) -->
  <g transform="translate(950, 160)">
    <!-- Column Card Background -->
    <rect x="0" y="0" width="390" height="600" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="390" height="54" rx="14" fill="url(#col-emerald-grad)"/>
    <text x="20" y="34" fill="#ffffff" font-size="17" font-weight="700">3. OUTPUT &amp; LOOP (成果與心跳)</text>
    
    <!-- Role Block -->
    <g transform="translate(20, 74)">
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="30" fill="#047857" font-size="15" font-weight="700">🛠️ QA &amp; DevOps Subagents</text>
      <text x="16" y="54" fill="#1e293b" font-size="13">• QA Tester: 負責品質與版權出處合規檢查</text>
      <text x="16" y="76" fill="#1e293b" font-size="13">• DevOps: 部署雲端與託管 Cron 定時任務</text>
      <text x="16" y="98" fill="#475569" font-size="12">審查未通過自動觸發 Self-Correction</text>
    </g>

    <!-- Engineering Block -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="30" fill="#065f46" font-size="15" font-weight="700">🔄 #Loop Engineering (心跳與校對)</text>
      <text x="16" y="56" fill="#1e293b" font-size="13">1. Heartbeat Trigger: 每日 07:00 排程自動喚醒</text>
      <text x="16" y="78" fill="#1e293b" font-size="13">2. ReAct Loop: 思考 ➔ 呼叫工具 ➔ 觀察修正</text>
      <text x="16" y="100" fill="#1e293b" font-size="13">3. QC Feedback: 格式與字數未過自動退回重寫</text>
      <rect x="16" y="114" width="318" height="24" rx="6" fill="#dcfce7"/>
      <text x="24" y="130" fill="#065f46" font-size="11" font-weight="700">合規保障：Copyright Defense (附帶出處與摘要)</text>
    </g>

    <!-- Practical Practice -->
    <g transform="translate(20, 384)">
      <rect x="0" y="0" width="350" height="190" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
      <text x="16" y="30" fill="#047857" font-size="15" font-weight="700">🛠️ 晨報 Agent 落地實作</text>
      <text x="16" y="58" fill="#0f172a" font-size="13" font-weight="700">📱 LINE Notify 推播通知</text>
      <text x="32" y="78" fill="#475569" font-size="12">早上 07:00 準時將完美格式晨報送達手機</text>
      
      <text x="16" y="106" fill="#0f172a" font-size="13" font-weight="700">🔄 SKILL.md 自動化腳本</text>
      <text x="32" y="126" fill="#475569" font-size="12">封裝全套流程，達成高可維護性</text>

      <rect x="16" y="142" width="318" height="32" rx="6" fill="#d1fae5"/>
      <text x="26" y="163" fill="#065f46" font-size="12" font-weight="700">🎉 最終成果：自動運行且好維護的 Agent</text>
    </g>
  </g>

  <!-- ==================== BOTTOM GOVERNANCE BANNER ==================== -->
  <g transform="translate(60, 780)">
    <rect x="0" y="0" width="1280" height="85" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <text x="24" y="32" fill="#92400e" font-size="15" font-weight="700">🛡️ 全貫穿層：AI 資安合規、智慧財產權與永續維護 (Governance &amp; Best Practices)</text>
    
    <g transform="translate(24, 44)">
      <rect x="0" y="0" width="380" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="20" fill="#78350f" font-size="11.5">🔒 <tspan font-weight="700">Prompt Injection 防禦</tspan>：Harness 層過濾標點與惡意指令</text>
    </g>

    <g transform="translate(424, 44)">
      <rect x="0" y="0" width="410" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="20" fill="#78350f" font-size="11.5">📜 <tspan font-weight="700">Copyright Claim 防衛</tspan>：禁止全文複製，強制衍生摘要與原連結</text>
    </g>

    <g transform="translate(854, 44)">
      <rect x="0" y="0" width="400" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="20" fill="#78350f" font-size="11.5">⚡ <tspan font-weight="700">無 Code 維護性</tspan>：業務邏輯與程式解耦，改 `.md` 即可維護</text>
    </g>
  </g>

  <!-- ==================== FOOTER SIGNATURE ==================== -->
  <g transform="translate(60, 885)">
    <text x="0" y="25" fill="#475569" font-size="13" font-weight="600" letter-spacing="0.5">National Chi Nan University (NCNU) • Vibe Coding Agent Architecture Handbook</text>
    <text x="1280" y="25" fill="#1e3a8a" font-size="15" font-weight="800" text-anchor="end" letter-spacing="0.5">Architect: Prof. Shihmin Lo, NCNU</text>
  </g>

</svg>
